<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Claude Config Manager</title>
    <link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
    <link rel="icon" type="image/png" href="assets/favicon.png" />
    <link rel="apple-touch-icon" href="assets/logo.png" />
    <link rel="stylesheet" href="styles.css" />
    <script>
      // Set the theme before first paint to avoid a flash.
      (function () {
        var saved = localStorage.getItem('theme');
        var prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
        document.documentElement.dataset.theme = saved || (prefersLight ? 'light' : 'dark');
      })();
    </script>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <img src="assets/logo.svg" alt="" class="brand-logo" />
        <span>Claude Config Manager</span>
      </div>
      <div class="topbar-actions">
        <input id="search" type="search" class="search" placeholder="Search files…" aria-label="Search files" />
        <div class="filter" role="group" aria-label="Scope filter">
          <button class="filter-btn active" data-scope="personal">Local</button>
          <button class="filter-btn" data-scope="shared">Shared</button>
          <button class="filter-btn" data-scope="all">All</button>
        </div>
        <span id="status" class="status"></span>
        <input id="addRoot" class="add-root" placeholder="Add a folder to scan…" />
        <button id="addBtn" class="btn">Add</button>
        <button id="rescanBtn" class="btn">Rescan</button>
        <button id="themeToggle" class="theme-toggle" title="Toggle light / dark" aria-label="Toggle light / dark"></button>
      </div>
    </header>

    <main class="layout">
      <nav id="contexts" class="col col-contexts" aria-label="Contexts"></nav>
      <section id="files" class="col col-files" aria-label="Files"></section>
      <section class="col col-editor">
        <div id="editorHeader" class="editor-header hidden">
          <div class="editor-meta">
            <div id="filePath" class="file-path"></div>
            <div id="fileInfo" class="file-info"></div>
          </div>
          <div class="editor-actions">
            <div id="viewToggle" class="filter view-toggle hidden" role="group" aria-label="View mode">
              <button class="view-btn active" data-view="raw">Raw</button>
              <button class="view-btn" data-view="preview">Preview</button>
            </div>
            <span id="dirty" class="dirty hidden">● unsaved</span>
            <button id="saveBtn" class="btn btn-primary" disabled>Save</button>
            <button id="deleteBtn" class="btn btn-danger">Delete</button>
          </div>
        </div>
        <div id="banner" class="banner hidden"></div>
        <textarea id="editor" class="editor" spellcheck="false" placeholder="Select a file to view or edit."></textarea>
        <div id="preview" class="preview hidden"></div>
        <div id="emptyState" class="empty-state">
          <p>Select a config file on the left.</p>
          <p class="muted">Everything Claude reads — global settings, instructions, skills, memory, and every project's config — indexed in one place.</p>
        </div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
