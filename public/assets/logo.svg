    <line x1="0" y1="-6" x2="0" y2="-156" transform="rotate(90)"/>
    <line x1="0" y1="-6" x2="0" y2="-186" transform="rotate(120)"/>
    <line x1="0" y1="-6" x2="0" y2="-150" transform="rotate(150)"/>
    <line x1="0" y1="-6" x2="0" y2="-196" transform="rotate(180)"/>
    <line x1="0" y1="-6" x2="0" y2="-152" transform="rotate(210)"/>
    <line x1="0" y1="-6" x2="0" y2="-206" transform="rotate(240)"/>
    <line x1="0" y1="-6" x2="0" y2="-150" transform="rotate(270)"/>
